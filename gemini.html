<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Mahjong Solitaire</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, #27ae60 0%, #1e5f38 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        h1 { 
            margin: 15px 0 5px 0; 
            font-weight: 600; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }
        #controls { margin-bottom: 15px; }
        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #linear-gradient(#e74c3c, #c0392b);
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: all 0.2s;
        }
        button:hover { background: #d63031; transform: translateY(-1px); }
        button:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        #game-container {
            position: relative;
            width: 850px;
            height: 625px;
            background: #143d22;
            border: 14px solid #3e2723; /* Edler dunkler Holzrahmen */
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.8);
        }
        
        /* Das neue, plastische Stein-Design */
        .tile {
            position: absolute;
            width: 50px;
            height: 68px;
            background: linear-gradient(135deg, #ffffff 0%, #f4f5f0 100%);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            
            /* Aufwendiger 3D-Effekt: Weiße Front, grüne Zwischenschicht, tiefer Schatten */
            box-shadow: 
                -1px 1px 0 #dbded3,
                -2px 2px 0 #2ecc71, /* Helle grüne Kante */
                -4px 4px 0 #27ae60, /* Dunklere grüne Kante */
                -5px 5px 1px #1e824c,
                -8px 8px 12px rgba(0,0,0,0.7); /* Weicher Echtzeitschatten */
            
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        
        /* Farb-Klassen für die traditionellen Zeichen */
        .tile .red { color: #d63031; text-shadow: 1px 1px 0px #ff8585, 0.5px 0.5px 0px #000; }
        .tile .green { color: #27ae60; text-shadow: 1px 1px 0px #a2f0c2, 0.5px 0.5px 0px #000; }
        .tile .blue { color: #2980b9; text-shadow: 1px 1px 0px #a9d4f0, 0.5px 0.5px 0px #000; }
        
        /* Hover-Effekt: Stein hebt sich leicht ab */
        .tile:hover {
            transform: translate(2px, -2px);
            filter: brightness(1.05);
        }
        
        /* Zustand: Ausgewählter Stein leuchtet golden */
        .tile.selected {
            background: linear-gradient(135deg, #fff9db 0%, #fff3bf 100%) !important;
            transform: translate(1px, -1px);
            box-shadow: 
                -1px 1px 0 #f5e7a3,
                -2px 2px 0 #f1c40f, /* Goldene Kante */
                -4px 4px 0 #f39c12, 
                -5px 5px 1px #e67e22,
                -8px 8px 15px rgba(241, 196, 15, 0.6);
        }
    </style>
</head>
<body>

    <h1>Premium Mahjong</h1>
    <div id="controls">
        <button onclick="initGame()">Neues Spiel</button>
    </div>
    <div id="game-container"></div>

<script>
const container = document.getElementById('game-container');
let tilesData = [];
let selectedTile = null;

const traditionalSymbols = [
    { char: '🀀', color: 'blue' }, { char: '🀁', color: 'blue' }, { char: '🀂', color: 'blue' }, { char: '🀃', color: 'blue' },
    { char: '🀄', color: 'red' }, { char: '🀅', color: 'green' }, { char: '🀆', color: 'blue' },
    { char: '🀇', color: 'red' }, { char: '🀈', color: 'red' }, { char: '🀉', color: 'red' }, { char: '🀊', color: 'red' }, { char: '🀋', color: 'red' }, { char: '🀌', color: 'red' }, { char: '🀍', color: 'red' }, { char: '🀎', color: 'red' }, { char: '🀏', color: 'red' },
    { char: '🀐', color: 'green' }, { char: '🀑', color: 'green' }, { char: '🀒', color: 'green' }, { char: '🀓', color: 'green' }, { char: '🀔', color: 'green' }, { char: '🀕', color: 'green' }, { char: '🀖', color: 'green' }, { char: '🀗', color: 'green' }, { char: '🀘', color: 'green' },
    { char: '🀙', color: 'blue' }, { char: '🀚', color: 'blue' }, { char: '🀛', color: 'blue' }, { char: '🀜', color: 'blue' }, { char: '🀝', color: 'blue' }, { char: '🀞', color: 'blue' }, { char: '🀟', color: 'blue' }, { char: '🀠', color: 'blue' }, { char: '🀡', color: 'blue' }
];

let symbolsPool = [];
traditionalSymbols.forEach(sym => {
    for(let i = 0; i < 4; i++) symbolsPool.push(sym);
});

const tileLayout = [];
function createLayout() {
    tileLayout.length = 0;
    // Abstände leicht optimiert für die neuen Steindimensionen
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 12; c++) {
            if ((r==0 || r==7) && (c<2 || c>9)) continue;
            tileLayout.push({x: c * 54 + 90, y: r * 70 + 35, z: 0});
        }
    }
    for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 8; c++) {
            tileLayout.push({x: c * 54 + 198, y: r * 70 + 105, z: 1});
        }
    }
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            tileLayout.push({x: c * 54 + 306, y: r * 70 + 175, z: 2});
        }
    }
    for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 2; c++) {
            tileLayout.push({x: c * 54 + 360, y: r * 70 + 245, z: 3});
        }
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

const TILE_W = 50, TILE_H = 68;
function isFree(tile) {
    let blockedLeft = false;
    let blockedRight = false;
    let blockedAbove = false;

    for (let other of tilesData) {
        if (other === tile) continue;
        if (other.z === tile.z + 1) {
            if (Math.abs(other.x - tile.x) < TILE_W && Math.abs(other.y - tile.y) < TILE_H) {
                blockedAbove = true;
            }
        }
        if (other.z === tile.z && Math.abs(other.y - tile.y) < TILE_H) {
            if (other.x === tile.x - 54) blockedLeft = true;
            if (other.x === tile.x + 54) blockedRight = true;
        }
    }
    return !blockedAbove && (!blockedLeft || !blockedRight);
}

function initGame() {
    container.innerHTML = '';
    selectedTile = null;
    createLayout();
    
    let currentSymbols = [...symbolsPool];
    shuffle(currentSymbols);
    
    const activeLayout = tileLayout.slice(0, currentSymbols.length);
    
    tilesData = activeLayout.map((pos, index) => {
        const item = currentSymbols[index];
        const el = document.createElement('div');
        el.className = 'tile';
        
        // 3D-Ebenen-Versatz berechnen
        el.style.left = `${pos.x - pos.z * 5}px`;
        el.style.top = `${pos.y - pos.z * 5}px`;
        el.style.zIndex = pos.z;
        
        el.innerHTML = `<span class="${item.color}">${item.char}</span>`;
        
        const tileObj = { el, x: pos.x, y: pos.y, z: pos.z, symbol: item.char };
        el.addEventListener('click', () => handleTileClick(tileObj));
        container.appendChild(el);
        return tileObj;
    });
}

function handleTileClick(tile) {
    if (!isFree(tile)) return;

    if (selectedTile === null) {
        selectedTile = tile;
        tile.el.classList.add('selected');
    } else if (selectedTile === tile) {
        tile.el.classList.remove('selected');
        selectedTile = null;
    } else {
        if (selectedTile.symbol === tile.symbol) {
            selectedTile.el.remove();
            tile.el.remove();
            tilesData = tilesData.filter(t => t !== tile && t !== selectedTile);
            selectedTile = null;
            
            if (tilesData.length === 0) {
                setTimeout(() => alert('Hervorragend! Das Spielfeld ist leer. 🀄'), 200);
            }
        } else {
            selectedTile.el.classList.remove('selected');
            selectedTile = tile;
            tile.el.classList.add('selected');
        }
    }
}

initGame();
</script>
</body>
</html>
