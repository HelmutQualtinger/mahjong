<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mahjong Solitaire (Freie Rotation)</title>
    <style>
        body {
            margin: 0;
            background: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ui {
            position: absolute;
            top: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            font-size: 24px;
        }
        p {
            margin: 0 0 10px 0;
            color: #bdc3c7;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        button {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            transition: all 0.2s;
        }
        button:hover { background: #d63031; transform: scale(1.05); }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h1>Mahjong 3D</h1>
        <p>Links-Klick: Steine wählen | Rechts-Klick & Ziehen: Frei drehen | Mausrad: Zoomen</p>
        <button onclick="initGame()">Neues Spiel</button>
    </div>

    <div id="canvas-container"></div>

<script>
let scene, camera, renderer, controls;
let tilesData = [];
let selectedTile = null;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const TILE_W = 1.0;
const TILE_H = 1.4;
const TILE_D = 0.35; 

const traditionalSymbols = [
    { char: '🀀', color: '#2980b9' }, { char: '🀁', color: '#2980b9' }, { char: '🀂', color: '#2980b9' }, { char: '🀃', color: '#2980b9' },
    { char: '🀄', color: '#d63031' }, { char: '🀅', color: '#27ae60' }, { char: '🀆', color: '#2980b9' },
    { char: '🀇', color: '#d63031' }, { char: '🀈', color: '#d63031' }, { char: '🀉', color: '#d63031' }, { char: '🀊', color: '#d63031' }, { char: '🀋', color: '#d63031' }, { char: '🀌', color: '#d63031' }, { char: '🀍', color: '#d63031' }, { char: '🀎', color: '#d63031' }, { char: '🀏', color: '#d63031' },
    { char: '🀐', color: '#27ae60' }, { char: '🀑', color: '#27ae60' }, { char: '🀒', color: '#27ae60' }, { char: '🀓', color: '#27ae60' }, { char: '🀔', color: '#27ae60' }, { char: '🀕', color: '#27ae60' }, { char: '🀖', color: '#27ae60' }, { char: '🀗', color: '#27ae60' }, { char: '🀘', color: '#27ae60' },
    { char: '🀙', color: '#2980b9' }, { char: '🀚', color: '#2980b9' }, { char: '🀛', color: '#2980b9' }, { char: '🀜', color: '#2980b9' }, { char: '🀝', color: '#2980b9' }, { char: '🀞', color: '#2980b9' }, { char: '🀟', color: '#2980b9' }, { char: '🀠', color: '#2980b9' }, { char: '🀡', color: '#2980b9' }
];

let symbolsPool = [];
traditionalSymbols.forEach(sym => {
    for(let i = 0; i < 4; i++) symbolsPool.push(sym);
});

function setupThree() {
    const container = document.getElementById('canvas-container');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color('#143d22');

    const aspect = window.innerWidth / window.innerHeight;
    const d = 7.5; 
    camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    
    camera.position.set(0, -10, 13); 
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    
    // Tastenbelegung für freie Kontrolle
    controls.mouseButtons = {
        LEFT: THREE.MOUSE.NONE,     
        MIDDLE: THREE.MOUSE.DOLLY,   
        RIGHT: THREE.MOUSE.ROTATE    
    };
    
    // Alle Rotationsbeschränkungen aufgehoben
    controls.minZoom = 0.5;
    controls.maxZoom = 3.0;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, -5, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const floorGeo = new THREE.PlaneGeometry(60, 60);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x11351d, roughness: 0.9 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.receiveShadow = true;
    scene.add(floor);

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('click', onCanvasClick);
}

function createTileTexture(char, color) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 171;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#fbfcf7';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.font = 'bold 100px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(char, canvas.width / 2 + 1, canvas.height / 2 + 3);
    
    ctx.fillStyle = color;
    ctx.fillText(char, canvas.width / 2, canvas.height / 2);

    return new THREE.CanvasTexture(canvas);
}

function createTileMaterials(char, color) {
    const faceTex = createTileTexture(char, color);
    return [
        new THREE.MeshStandardMaterial({ color: '#e8e9e0', roughness: 0.5 }), 
        new THREE.MeshStandardMaterial({ color: '#e8e9e0', roughness: 0.5 }), 
        new THREE.MeshStandardMaterial({ color: '#e8e9e0', roughness: 0.5 }), 
        new THREE.MeshStandardMaterial({ color: '#e8e9e0', roughness: 0.5 }), 
        new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.3 }),      
        new THREE.MeshStandardMaterial({ color: '#27ae60', roughness: 0.4 })  
    ];
}

const tileLayout = [];
function generateLayout() {
    tileLayout.length = 0;
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 12; c++) {
            if ((r==0 || r==7) && (c<2 || c>9)) continue;
            tileLayout.push({ cx: c - 5.5, cy: 3.5 - r, cz: 0 });
        }
    }
    for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 8; c++) {
            tileLayout.push({ cx: c - 3.5, cy: 2.5 - r, cz: 1 });
        }
    }
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            tileLayout.push({ cx: c - 1.5, cy: 1.5 - r, cz: 2 });
        }
    }
    for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 2; c++) {
            tileLayout.push({ cx: c - 0.5, cy: 0.5 - r, cz: 3 });
        }
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// KORRIGIERTE LOGIK: Erkennt jetzt Nachbarn in allen Zeilen korrekt
function isFree(tile) {
    let blockedLeft = false;
    let blockedRight = false;
    let blockedAbove = false;

    // Toleranzschwelle für präzises mathematisches Grid-Matching
    const epsilon = 0.05;

    for (let other of tilesData) {
        if (other === tile) continue;

        // Prüfe, ob ein Stein direkt darüber liegt (Z-Ebene + 1)
        if (other.cz === tile.cz + 1) {
            if (Math.abs(other.cx - tile.cx) < (TILE_W - epsilon) && 
                Math.abs(other.cy - tile.cy) < (TILE_H - epsilon)) {
                blockedAbove = true;
            }
        }
        
        // Prüfe Blockierungen links/rechts auf derselben Z-Ebene
        if (other.cz === tile.cz && Math.abs(other.cy - tile.cy) < epsilon) {
            if (Math.abs((tile.cx - (TILE_W + 0.04)) - other.cx) < epsilon) blockedLeft = true;
            if (Math.abs((tile.cx + (TILE_W + 0.04)) - other.cx) < epsilon) blockedRight = true;
        }
    }
    return !blockedAbove && (!blockedLeft || !blockedRight);
}

function initGame() {
    tilesData.forEach(t => {
        scene.remove(t.mesh);
        t.mesh.material.forEach(m => m.dispose());
    });
    tilesData = [];
    selectedTile = null;

    camera.position.set(0, -10, 13);
    if(controls) controls.target.set(0, 0, 0);

    generateLayout();
    let currentSymbols = [...symbolsPool];
    shuffle(currentSymbols);

    const activeLayout = tileLayout.slice(0, currentSymbols.length);
    const geometry = new THREE.BoxGeometry(TILE_W, TILE_H, TILE_D);

    activeLayout.forEach((pos, index) => {
        const sym = currentSymbols[index];
        const materials = createTileMaterials(sym.char, sym.color);
        const mesh = new THREE.Mesh(geometry, materials);

        mesh.position.set(
            pos.cx * (TILE_W + 0.04), 
            pos.cy * (TILE_H + 0.04), 
            pos.cz * TILE_D + (TILE_D / 2)
        );
        
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);

        const tileObj = { mesh, cx: mesh.position.x, cy: mesh.position.y, cz: pos.cz, symbol: sym.char };
        mesh.userData = tileObj;
        tilesData.push(tileObj);
    });
}

function onCanvasClick(event) {
    if (event.button !== 0) return; 

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(tilesData.map(t => t.mesh));

    if (intersects.length > 0) {
        const clickedMesh = intersects[0].object;
        const tile = clickedMesh.userData;

        if (!isFree(tile)) return;

        if (selectedTile === null) {
            selectedTile = tile;
            tile.mesh.position.z += 0.2; 
            tile.mesh.material.forEach(m => {
                if(m.emissive) m.emissive.setHex(0x2a2a00);
            });
        } else if (selectedTile === tile) {
            tile.mesh.position.z -= 0.2;
            tile.mesh.material.forEach(m => {
                if(m.emissive) m.emissive.setHex(0x000000);
            });
            selectedTile = null;
        } else {
            if (selectedTile.symbol === tile.symbol) {
                scene.remove(selectedTile.mesh);
                scene.remove(tile.mesh);
                
                selectedTile.mesh.material.forEach(m => m.dispose());
                tile.mesh.material.forEach(m => m.dispose());

                tilesData = tilesData.filter(t => t !== tile && t !== selectedTile);
                selectedTile = null;

                if (tilesData.length === 0) {
                    setTimeout(() => alert('Sieg! Alle Steine wurden abgeräumt! 🀄'), 200);
                }
            } else {
                selectedTile.mesh.position.z -= 0.2;
                selectedTile.mesh.material.forEach(m => {
                    if(m.emissive) m.emissive.setHex(0x000000);
                });
                
                selectedTile = tile;
                tile.mesh.position.z += 0.2;
                tile.mesh.material.forEach(m => {
                    if(m.emissive) m.emissive.setHex(0x2a2a00);
                });
            }
        }
    }
}

function onWindowResize() {
    const aspect = window.innerWidth / window.innerHeight;
    const d = 7.5;
    camera.left = -d * aspect;
    camera.right = d * aspect;
    camera.top = d;
    camera.bottom = -d;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    if(controls) controls.update();
    renderer.render(scene, camera);
}

setupThree();
initGame();
animate();
</script>
</body>
</html>
