<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahjong Solitaire</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Cinzel:wght@400;700&display=swap');

:root {
  --bg: #0a1628;
  --bg2: #0f1f3d;
  --gold: #d4af37;
  --tile-face: #f5eed8;
  --tile-side-r: #c8b98a;
  --tile-side-b: #a89660;
  --tile-border: #8a7a50;
  --selected: #ffe066;
  --hint: #66ffcc;
  --text: #e8d5a0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cinzel', serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 16px;
  background: linear-gradient(180deg, #0a1628 0%, #0d1f3a 100%);
  border-bottom: 1px solid #1e3a5f;
  flex-shrink: 0;
  gap: 10px;
  flex-wrap: wrap;
}

#topbar h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.3em;
  color: var(--gold);
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(212,175,55,0.4);
  white-space: nowrap;
}

.stats {
  display: flex;
  gap: 16px;
  font-size: 0.72em;
  color: #a0b8d0;
}
.stat { text-align: center; }
.stat-val { font-size: 1.4em; color: var(--gold); display: block; line-height: 1.1; }

.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

button {
  padding: 5px 12px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.68em;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s;
  white-space: nowrap;
}
button:hover { background: rgba(212,175,55,0.15); }
button:active { background: rgba(212,175,55,0.3); }

/* Layout selector */
.layout-select-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.68em;
  color: #a0b8d0;
  white-space: nowrap;
}
select#layout-select {
  background: #0d1f3a;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 1em;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
  outline: none;
}
select#layout-select option { background: #0d1f3a; }

/* Game area */
#game-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(10,80,40,0.25) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(10,30,80,0.3) 0%, transparent 60%),
    var(--bg2);
}

#board {
  position: relative;
  transform-origin: center center;
}

/* TILE */
.tile {
  position: absolute;
  width: 52px;
  height: 68px;
  cursor: pointer;
  transition: filter 0.1s;
}
.tile.blocked { cursor: default; }

.tile .face {
  position: absolute;
  inset: 0;
  background: var(--tile-face);
  border-radius: 5px;
  border: 1px solid var(--tile-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  line-height: 1;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.8),
    inset 0 -1px 0 rgba(0,0,0,0.12);
  overflow: hidden;
  transition: background 0.1s, box-shadow 0.1s;
}

/* 3D right edge */
.tile::after {
  content: '';
  position: absolute;
  right: -5px; top: 4px;
  width: 5px; height: 100%;
  background: var(--tile-side-r);
  border-radius: 0 3px 3px 0;
  border-top: 1px solid #b8a870;
  border-right: 1px solid #8a7040;
  border-bottom: 1px solid #6a5030;
}

/* 3D bottom edge */
.tile::before {
  content: '';
  position: absolute;
  bottom: -4px; left: 4px;
  width: 100%; height: 4px;
  background: var(--tile-side-b);
  border-radius: 0 0 3px 3px;
  border-left: 1px solid #9a8850;
  border-bottom: 1px solid #6a5030;
}

.tile.selected .face {
  background: #fff8d0;
  border-color: var(--selected);
  box-shadow: 0 0 0 2px var(--selected), inset 0 1px 0 rgba(255,255,255,0.9), 0 0 15px rgba(255,224,102,0.6);
}
.tile.hint-flash .face {
  background: #d0fff0;
  border-color: var(--hint);
  box-shadow: 0 0 0 2px var(--hint), 0 0 18px rgba(102,255,204,0.7);
}
.tile.blocked .face { filter: brightness(0.72) saturate(0.6); }
.tile:not(.blocked):not(.selected):hover .face { background: #fffae8; border-color: #c8a840; }

.tile .corner-tl, .tile .corner-br {
  position: absolute;
  font-size: 9px; line-height: 1;
  font-family: 'Noto Serif SC', serif;
}
.tile .corner-tl { top: 3px; left: 4px; }
.tile .corner-br { bottom: 3px; right: 4px; transform: rotate(180deg); }

.suit-man .face   { color: #c0392b; }
.suit-pin .face   { color: #1a4a8a; }
.suit-sou .face   { color: #1a7a3c; }
.suit-wind .face  { color: #2c3e50; }
.suit-dragon .face{ color: #8b0000; }
.suit-flower .face{ color: #9b59b6; }
.suit-season .face{ color: #e67e22; }

/* Overlay */
#overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: center; justify-content: center;
}
#overlay.show { display: flex; }
#overlay-box {
  background: linear-gradient(135deg, #0f1f3d, #0a2815);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 40px 60px;
  text-align: center;
  box-shadow: 0 0 60px rgba(212,175,55,0.3);
}
#overlay-box h2 {
  font-size: 2em; color: var(--gold); margin-bottom: 10px;
  font-family: 'Noto Serif SC', serif; letter-spacing: 4px;
}
#overlay-box p { color: #a0b8d0; margin-bottom: 24px; }
#overlay-box button { padding: 10px 28px; font-size: 0.85em; }

#no-moves {
  display: none;
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%);
  background: rgba(192,57,43,0.9);
  color: #fff; padding: 8px 20px; border-radius: 20px;
  font-size: 0.8em; z-index: 50;
}
@keyframes tileRemove { to { opacity: 0; transform: scale(0.8); } }
.tile.removing { animation: tileRemove 0.22s forwards; pointer-events: none; }
</style>
</head>
<body>

<div id="topbar">
  <h1>雀 Mahjong</h1>
  <div class="stats">
    <div class="stat"><span class="stat-val" id="score-val">0</span>Punkte</div>
    <div class="stat"><span class="stat-val" id="pairs-val">0</span>Paare</div>
    <div class="stat"><span class="stat-val" id="left-val">144</span>Übrig</div>
    <div class="stat"><span class="stat-val" id="timer-val">0:00</span>Zeit</div>
  </div>
  <div class="controls">
    <div class="layout-select-wrap">
      Layout:
      <select id="layout-select" onchange="newGame()">
        <option value="turtle">🐢 Schildkröte</option>
        <option value="dragon">🐉 Drache</option>
        <option value="pyramid">🔺 Pyramide</option>
        <option value="cross">✚ Kreuz</option>
        <option value="castle">🏰 Festung</option>
      </select>
    </div>
    <button onclick="undoMove()">↩ Rückgängig</button>
    <button onclick="showHint()">💡 Hinweis</button>
    <button onclick="newGame()">↺ Neu</button>
  </div>
</div>

<div id="game-area"><div id="board"></div></div>

<div id="overlay">
  <div id="overlay-box">
    <h2 id="overlay-title">勝利!</h2>
    <p id="overlay-msg"></p>
    <button onclick="newGame()">Neues Spiel</button>
  </div>
</div>
<div id="no-moves">Keine Züge mehr möglich!</div>

<script>
// ─── TILE TYPES ───────────────────────────────────────────────────────────────
const MAN_GLYPHS    = ['一','二','三','四','五','六','七','八','九'];
const PIN_GLYPHS    = ['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'];
const SOU_GLYPHS    = ['🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘'];
const WIND_GLYPHS   = ['東','南','西','北'];
const DRAGON_GLYPHS = ['中','發','白'];
const FLOWER_GLYPHS = ['梅','蘭','菊','竹'];
const SEASON_GLYPHS = ['春','夏','秋','冬'];

function buildTileTypes() {
  const t = [];
  for(let i=0;i<9;i++) t.push({suit:'man',    idx:i, glyph:MAN_GLYPHS[i],    key:`man${i}`});
  for(let i=0;i<9;i++) t.push({suit:'pin',    idx:i, glyph:PIN_GLYPHS[i],    key:`pin${i}`});
  for(let i=0;i<9;i++) t.push({suit:'sou',    idx:i, glyph:SOU_GLYPHS[i],    key:`sou${i}`});
  for(let i=0;i<4;i++) t.push({suit:'wind',   idx:i, glyph:WIND_GLYPHS[i],   key:`wind${i}`});
  for(let i=0;i<3;i++) t.push({suit:'dragon', idx:i, glyph:DRAGON_GLYPHS[i], key:`dragon${i}`});
  // flowers & seasons each match within their group; 1 copy each (4 total per group)
  for(let i=0;i<4;i++) t.push({suit:'flower', idx:i, glyph:FLOWER_GLYPHS[i], key:'flower', matchGroup:'flower'});
  for(let i=0;i<4;i++) t.push({suit:'season', idx:i, glyph:SEASON_GLYPHS[i], key:'season', matchGroup:'season'});
  return t; // 34 base types → 34×4 - 4 - 4 + 4 + 4 = 136 + 8 = 144 when expanded
}

// ─── LAYOUTS ──────────────────────────────────────────────────────────────────
// Each layout function returns exactly 144 {layer,col,row} positions.
// Convention: layer 0 = bottom, higher layer = on top.
// isFree check uses integer col/row equality, so stacking must be exact.

const LAYOUTS = {

  // ── Schildkröte (Turtle) ──────────────────────────────────────────────────
  // Classic pyramid: flat base + 5 ascending layers + 4 wing tiles.
  // L0=60, wings=4, L1=36, L2=24, L3=12, L4=6, L5=2  →  144
  turtle: {
    label: '🐢 Schildkröte',
    build() {
      const p = [];
      const a = (l,c,r) => p.push({layer:l,col:c,row:r});
      // L0: 12 cols × 5 rows = 60
      for(let r=0;r<5;r++) for(let c=0;c<12;c++) a(0,c,r);
      // Wings: 4 tiles flanking rows 1-2
      a(0,-1,1); a(0,-1,2); a(0,12,1); a(0,12,2);
      // L1: cols 1-9 × rows 0-3 = 9×4 = 36
      for(let r=0;r<4;r++) for(let c=1;c<=9;c++) a(1,c,r);
      // L2: cols 2-9 × rows 0-2 = 8×3 = 24
      for(let r=0;r<3;r++) for(let c=2;c<=9;c++) a(2,c,r);
      // L3: cols 3-8 × rows 0-1 = 6×2 = 12
      for(let r=0;r<2;r++) for(let c=3;c<=8;c++) a(3,c,r);
      // L4: cols 3-8 × row 0 = 6
      for(let c=3;c<=8;c++) a(4,c,0);
      // L5: cols 4-5 × row 0 = 2
      a(5,4,0); a(5,5,0);
      // Total: 60+4+36+24+12+6+2 = 144 ✓
      return p;
    }
  },

  // ── Drache (Dragon) ───────────────────────────────────────────────────────
  // Long horizontal serpent: spine + belly bumps + head + tail, 6 stacked layers.
  // L0=60, L1=32, L2=24, L3=16, L4=8, L5=4  →  144
  dragon: {
    label: '🐉 Drache',
    build() {
      const p = [];
      const a = (l,c,r) => p.push({layer:l,col:c,row:r});
      // Spine: rows 2-3, cols 0-17 = 2×18 = 36
      for(let c=0;c<18;c++) { a(0,c,2); a(0,c,3); }
      // Belly bumps: rows 1 & 4, cols 6-11 = 2×6 = 12
      for(let c=6;c<12;c++) { a(0,c,1); a(0,c,4); }
      // Head (right): col 18, rows 0-5 = 6
      for(let r=0;r<6;r++) a(0,18,r);
      // Tail (left): col -1, rows 0-5 = 6
      for(let r=0;r<6;r++) a(0,-1,r);
      // L0 total: 36+12+6+6 = 60 ✓
      // Stacked layers on spine (rows 2-3):
      for(let c=1;c<17;c++) { a(1,c,2); a(1,c,3); }  // L1: 16×2 = 32
      for(let c=3;c<15;c++) { a(2,c,2); a(2,c,3); }  // L2: 12×2 = 24
      for(let c=5;c<13;c++) { a(3,c,2); a(3,c,3); }  // L3:  8×2 = 16
      for(let c=7;c<11;c++) { a(4,c,2); a(4,c,3); }  // L4:  4×2 = 8
      for(let c=8;c<10;c++) { a(5,c,2); a(5,c,3); }  // L5:  2×2 = 4
      // Total: 60+32+24+16+8+4 = 144 ✓
      return p;
    }
  },

  // ── Pyramide ──────────────────────────────────────────────────────────────
  // Stepped pyramid viewed from above: 4 concentric shrinking rectangles.
  // L0=72, L1=36, L2=24, L3=12  →  144
  pyramid: {
    label: '🔺 Pyramide',
    build() {
      const p = [];
      const a = (l,c,r) => p.push({layer:l,col:c,row:r});
      // L0: 12×6 = 72
      for(let r=0;r<6;r++) for(let c=0;c<12;c++) a(0,c,r);
      // L1: cols 1-9 × rows 1-4 = 9×4 = 36
      for(let r=1;r<5;r++) for(let c=1;c<=9;c++) a(1,c,r);
      // L2: cols 2-9 × rows 1-3 = 8×3 = 24
      for(let r=1;r<4;r++) for(let c=2;c<=9;c++) a(2,c,r);
      // L3: cols 3-8 × rows 1-2 = 6×2 = 12
      for(let r=1;r<3;r++) for(let c=3;c<=8;c++) a(3,c,r);
      // Total: 72+36+24+12 = 144 ✓
      return p;
    }
  },

  // ── Kreuz (Cross) ─────────────────────────────────────────────────────────
  // Cross / plus-sign shape: wide horizontal bar + vertical extensions, stacked in center.
  // L0=72, L1=40, L2=24, L3=8  →  144
  cross: {
    label: '✚ Kreuz',
    build() {
      const p = [];
      const a = (l,c,r) => p.push({layer:l,col:c,row:r});
      // Horizontal bar: rows 2-5, cols 0-11 = 4×12 = 48
      for(let r=2;r<6;r++) for(let c=0;c<12;c++) a(0,c,r);
      // Vertical arm extensions: rows 0-1 & 6-7, cols 3-8 = 4×6 = 24
      for(let c=3;c<9;c++) { a(0,c,0); a(0,c,1); a(0,c,6); a(0,c,7); }
      // L0 total: 48+24 = 72 ✓
      // L1: rows 2-5, cols 1-10 = 4×10 = 40
      for(let r=2;r<6;r++) for(let c=1;c<=10;c++) a(1,c,r);
      // L2: rows 2-5, cols 3-8 = 4×6 = 24
      for(let r=2;r<6;r++) for(let c=3;c<=8;c++) a(2,c,r);
      // L3: rows 3-4, cols 4-7 = 2×4 = 8
      for(let r=3;r<5;r++) for(let c=4;c<=7;c++) a(3,c,r);
      // Total: 72+40+24+8 = 144 ✓
      return p;
    }
  },

  // ── Festung (Castle) ──────────────────────────────────────────────────────
  // Concentric filled rectangles, like a tower seen from above.
  // L0=72, L1=42, L2=20, L3=10  →  144
  castle: {
    label: '🏰 Festung',
    build() {
      const p = [];
      const a = (l,c,r) => p.push({layer:l,col:c,row:r});
      // L0: 9 cols × 8 rows = 72
      for(let r=0;r<8;r++) for(let c=0;c<9;c++) a(0,c,r);
      // L1: cols 1-7 × rows 1-6 = 7×6 = 42
      for(let r=1;r<7;r++) for(let c=1;c<=7;c++) a(1,c,r);
      // L2: cols 2-5 × rows 2-6 = 4×5 = 20
      for(let r=2;r<7;r++) for(let c=2;c<=5;c++) a(2,c,r);
      // L3: cols 2-6 × rows 3-4 = 5×2 = 10
      for(let r=3;r<5;r++) for(let c=2;c<=6;c++) a(3,c,r);
      // Total: 72+42+20+10 = 144 ✓
      return p;
    }
  },
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let tiles = [], selected = null;
let score = 0, pairsRemoved = 0;
let timerStart, timerInterval;
let history = [];
let hintTimeout = null;

// ─── GAME INIT ────────────────────────────────────────────────────────────────
function newGame() {
  document.getElementById('overlay').classList.remove('show');
  clearInterval(timerInterval);
  selected = null; score = 0; pairsRemoved = 0; history = [];
  updateStats();

  const layoutKey = document.getElementById('layout-select').value;
  const layout = LAYOUTS[layoutKey].build(); // 144 positions

  // Build pool: 144 tiles
  const types = buildTileTypes();
  const pool = [];
  for(const t of types) {
    const copies = t.matchGroup ? 1 : 4; // flowers/seasons: 1 copy each
    for(let i=0;i<copies;i++) pool.push({...t});
  }
  fisherYates(pool);

  tiles = layout.map((pos, i) => ({
    id: i,
    col: pos.col, row: pos.row, layer: pos.layer,
    suit: pool[i].suit, idx: pool[i].idx,
    glyph: pool[i].glyph, key: pool[i].key,
    matchGroup: pool[i].matchGroup || null,
    removed: false, el: null,
  }));

  renderBoard();
  updateFreeStatus();

  timerStart = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
}

function fisherYates(arr) {
  for(let i=arr.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
const TW = 56, TH = 72;           // pixel step per col/row
const LX = 4,  LY = -3;           // pixel offset per layer (3D effect)

function px(col, row, layer) {
  return { x: col*TW + layer*LX, y: row*TH + layer*LY };
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for(const t of tiles) {
    const p = px(t.col, t.row, t.layer);
    minX = Math.min(minX, p.x);       minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x+52+8);  maxY = Math.max(maxY, p.y+68+8);
  }
  board.style.width  = (maxX-minX)+'px';
  board.style.height = (maxY-minY)+'px';

  // Sort: lower layers first, within layer by row then col (painter's algorithm)
  const sorted = [...tiles].sort((a,b) =>
    a.layer !== b.layer ? a.layer-b.layer : a.row !== b.row ? a.row-b.row : a.col-b.col
  );

  for(const t of sorted) {
    if(t.removed) continue;
    const p = px(t.col, t.row, t.layer);
    const el = document.createElement('div');
    el.className = 'tile suit-'+t.suit;
    el.style.left   = (p.x-minX)+'px';
    el.style.top    = (p.y-minY)+'px';
    el.style.zIndex = t.layer*200 + t.row*10 + t.col + 100;

    const face = document.createElement('div');
    face.className = 'face';
    face.textContent = t.glyph;

    if(['man','pin','sou'].includes(t.suit)) {
      const tl = document.createElement('span'); tl.className='corner-tl'; tl.textContent = t.idx+1;
      const br = document.createElement('span'); br.className='corner-br'; br.textContent = t.idx+1;
      face.appendChild(tl); face.appendChild(br);
    }

    el.appendChild(face);
    el.addEventListener('click', ()=>clickTile(t));
    t.el = el;
    board.appendChild(el);
  }

  // Scale board to fit game area
  const area = document.getElementById('game-area');
  const scale = Math.min((area.clientWidth-20)/(maxX-minX), (area.clientHeight-20)/(maxY-minY), 1);
  board.style.transform = `scale(${scale})`;
}

// ─── FREE-TILE LOGIC ──────────────────────────────────────────────────────────
function isFree(tile) {
  if(tile.removed) return false;
  // Blocked above: any non-removed tile at layer+1 at same (col,row)
  if(tiles.some(o => !o.removed && o.layer===tile.layer+1 && o.col===tile.col && o.row===tile.row))
    return false;
  // Blocked on both sides: must have at least one side open
  const hasLeft  = tiles.some(o => !o.removed && o.layer===tile.layer && o.col===tile.col-1 && o.row===tile.row);
  const hasRight = tiles.some(o => !o.removed && o.layer===tile.layer && o.col===tile.col+1 && o.row===tile.row);
  return !hasLeft || !hasRight;
}

function updateFreeStatus() {
  for(const t of tiles) {
    if(t.removed) continue;
    t.el.classList.toggle('blocked', !isFree(t));
  }
}

function tilesMatch(a, b) {
  if(a.id===b.id) return false;
  if(a.matchGroup && b.matchGroup) return a.matchGroup===b.matchGroup;
  return a.key===b.key;
}

// ─── CLICK ────────────────────────────────────────────────────────────────────
function clickTile(tile) {
  if(tile.removed || tile.el.classList.contains('blocked')) return;

  if(selected===null) {
    selected = tile;
    tile.el.classList.add('selected');
    return;
  }
  if(selected===tile) {
    tile.el.classList.remove('selected');
    selected = null;
    return;
  }

  if(tilesMatch(selected, tile)) {
    const a=selected, b=tile;
    history.push({a, b});
    [a,b].forEach(t => {
      t.el.classList.add('removing');
      setTimeout(()=>{ t.removed=true; t.el.style.display='none'; }, 220);
    });
    selected = null;
    pairsRemoved++; score += 10;
    updateStats();
    setTimeout(()=>{ updateFreeStatus(); checkEndState(); }, 240);
  } else {
    selected.el.classList.remove('selected');
    selected = tile;
    tile.el.classList.add('selected');
  }
}

// ─── UNDO ─────────────────────────────────────────────────────────────────────
function undoMove() {
  if(!history.length) return;
  const {a, b} = history.pop();
  [a,b].forEach(saved => {
    const t = tiles[saved.id];
    t.removed = false;
    t.el.style.display = '';
    t.el.classList.remove('removing');
  });
  if(selected) { selected.el.classList.remove('selected'); selected=null; }
  pairsRemoved--; score = Math.max(0, score-10);
  updateFreeStatus(); updateStats();
}

// ─── HINT ─────────────────────────────────────────────────────────────────────
function showHint() {
  if(hintTimeout) clearTimeout(hintTimeout);
  const free = tiles.filter(t=>!t.removed && isFree(t));
  for(let i=0;i<free.length;i++) {
    for(let j=i+1;j<free.length;j++) {
      if(tilesMatch(free[i], free[j])) {
        const [a,b] = [free[i], free[j]];
        a.el.classList.add('hint-flash'); b.el.classList.add('hint-flash');
        hintTimeout = setTimeout(()=>{
          a.el.classList.remove('hint-flash'); b.el.classList.remove('hint-flash');
        }, 1600);
        return;
      }
    }
  }
  flashNoMoves();
}

function flashNoMoves() {
  const el = document.getElementById('no-moves');
  el.style.display = 'block';
  clearTimeout(flashNoMoves._t);
  flashNoMoves._t = setTimeout(()=>el.style.display='none', 2800);
}

// ─── WIN / LOSE ───────────────────────────────────────────────────────────────
function checkEndState() {
  const remaining = tiles.filter(t=>!t.removed);
  if(!remaining.length) {
    clearInterval(timerInterval);
    const s = Math.floor((Date.now()-timerStart)/1000);
    showOverlay('勝利!', `Alle 72 Paare entfernt! Zeit: ${fmt(s)} | Punkte: ${score}`);
    return;
  }
  const free = remaining.filter(t=>isFree(t));
  let ok=false;
  outer: for(let i=0;i<free.length;i++)
    for(let j=i+1;j<free.length;j++)
      if(tilesMatch(free[i],free[j])){ok=true;break outer;}
  if(!ok) {
    clearInterval(timerInterval);
    showOverlay('Keine Züge', `Keine weiteren Züge möglich. Noch ${remaining.length} Steine übrig.`);
  }
}

function showOverlay(title, msg) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent   = msg;
  document.getElementById('overlay').classList.add('show');
}

// ─── STATS / TIMER ────────────────────────────────────────────────────────────
function updateTimer() {
  document.getElementById('timer-val').textContent = fmt(Math.floor((Date.now()-timerStart)/1000));
}
function fmt(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function updateStats() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('pairs-val').textContent = pairsRemoved;
  document.getElementById('left-val').textContent  = tiles.filter(t=>!t.removed).length;
}

// ─── RESIZE / START ───────────────────────────────────────────────────────────
window.addEventListener('resize', ()=>{ if(tiles.length){ renderBoard(); updateFreeStatus(); } });
newGame();
</script>
