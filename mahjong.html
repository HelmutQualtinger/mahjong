<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahjong Solitaire</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Cinzel:wght@400;700&display=swap');

:root {
  --gold: #d4af37;
  --bg:   #0a1628;
  --text: #e8d5a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cinzel', serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 16px;
  background: linear-gradient(180deg, #0a1628, #0d1f3a);
  border-bottom: 1px solid #1e3a5f;
  flex-shrink: 0;
  gap: 10px;
  flex-wrap: wrap;
  z-index: 10;
}

#topbar h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.3em;
  color: var(--gold);
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(212,175,55,0.4);
  white-space: nowrap;
}

.stats { display:flex; gap:16px; font-size:0.72em; color:#a0b8d0; }
.stat  { text-align:center; }
.stat-val { font-size:1.4em; color:var(--gold); display:block; line-height:1.1; }

.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

button {
  padding: 5px 12px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.68em;
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.15s;
  white-space: nowrap;
}
button:hover  { background: rgba(212,175,55,0.15); }
button:active { background: rgba(212,175,55,0.3); }

.layout-wrap { display:flex; align-items:center; gap:6px; font-size:0.68em; color:#a0b8d0; }
select#layout-select {
  background: #0d1f3a;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 1em;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
  outline: none;
}
select#layout-select option { background: #0d1f3a; }

#game-area {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#game-area canvas { display: block; }

/* Overlay */
#overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center; justify-content: center;
}
#overlay.show { display: flex; }
#overlay-box {
  background: linear-gradient(135deg, #0f1f3d, #0a2815);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 40px 60px;
  text-align: center;
  box-shadow: 0 0 60px rgba(212,175,55,0.3);
}
#overlay-box h2 {
  font-size:2em; color:var(--gold); margin-bottom:10px;
  font-family:'Noto Serif SC',serif; letter-spacing:4px;
}
#overlay-box p { color:#a0b8d0; margin-bottom:24px; }
#overlay-box button { padding:10px 28px; font-size:0.85em; }

#no-moves {
  display: none;
  position: fixed; bottom:20px; left:50%;
  transform: translateX(-50%);
  background: rgba(192,57,43,0.92);
  color:#fff; padding:8px 22px; border-radius:20px;
  font-size:0.8em; z-index:50;
}
</style>
</head>
<body>

<div id="topbar">
  <h1>雀 Mahjong</h1>
  <div class="stats">
    <div class="stat"><span class="stat-val" id="score-val">0</span>Punkte</div>
    <div class="stat"><span class="stat-val" id="pairs-val">0</span>Paare</div>
    <div class="stat"><span class="stat-val" id="left-val">144</span>Übrig</div>
    <div class="stat"><span class="stat-val" id="timer-val">0:00</span>Zeit</div>
  </div>
  <div class="controls">
    <div class="layout-wrap">
      Layout:
      <select id="layout-select" onchange="newGame()">
        <option value="turtle">🐢 Schildkröte</option>
        <option value="dragon">🐉 Drache</option>
        <option value="pyramid">🔺 Pyramide</option>
        <option value="cross">✚ Kreuz</option>
        <option value="castle">🏰 Festung</option>
      </select>
    </div>
    <button onclick="undoMove()">↩ Rückgängig</button>
    <button onclick="showHint()">💡 Hinweis</button>
    <button onclick="newGame()">↺ Neu</button>
  </div>
</div>

<div id="game-area"></div>

<div id="overlay">
  <div id="overlay-box">
    <h2 id="overlay-title">勝利!</h2>
    <p id="overlay-msg"></p>
    <button onclick="newGame()">Neues Spiel</button>
  </div>
</div>
<div id="no-moves">Keine Züge mehr möglich!</div>

<script>
// ─── TILE TYPES ───────────────────────────────────────────────────────────────
const MAN_G    = ['一','二','三','四','五','六','七','八','九'];
const PIN_G    = ['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'];
const SOU_G    = ['🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘'];
const WIND_G   = ['東','南','西','北'];
const DRAGON_G = ['中','發','白'];
const FLOWER_G = ['梅','蘭','菊','竹'];
const SEASON_G = ['春','夏','秋','冬'];

function buildTileTypes() {
  const t = [];
  for(let i=0;i<9;i++) t.push({suit:'man',    idx:i, glyph:MAN_G[i],    key:`man${i}`});
  for(let i=0;i<9;i++) t.push({suit:'pin',    idx:i, glyph:PIN_G[i],    key:`pin${i}`});
  for(let i=0;i<9;i++) t.push({suit:'sou',    idx:i, glyph:SOU_G[i],    key:`sou${i}`});
  for(let i=0;i<4;i++) t.push({suit:'wind',   idx:i, glyph:WIND_G[i],   key:`wind${i}`});
  for(let i=0;i<3;i++) t.push({suit:'dragon', idx:i, glyph:DRAGON_G[i], key:`dragon${i}`});
  for(let i=0;i<4;i++) t.push({suit:'flower', idx:i, glyph:FLOWER_G[i], key:'flower', matchGroup:'flower'});
  for(let i=0;i<4;i++) t.push({suit:'season', idx:i, glyph:SEASON_G[i], key:'season', matchGroup:'season'});
  return t;
}

// ─── LAYOUTS (each returns exactly 144 {layer,col,row} positions) ─────────────
const LAYOUTS = {
  turtle: { label:'🐢 Schildkröte', build() {
    const p=[]; const a=(l,c,r)=>p.push({layer:l,col:c,row:r});
    for(let r=0;r<5;r++) for(let c=0;c<12;c++) a(0,c,r);       // L0: 60
    a(0,-1,1);a(0,-1,2);a(0,12,1);a(0,12,2);                    // wings: 4
    for(let r=0;r<4;r++) for(let c=1;c<=9;c++) a(1,c,r);        // L1: 36
    for(let r=0;r<3;r++) for(let c=2;c<=9;c++) a(2,c,r);        // L2: 24
    for(let r=0;r<2;r++) for(let c=3;c<=8;c++) a(3,c,r);        // L3: 12
    for(let c=3;c<=8;c++) a(4,c,0);                               // L4: 6
    a(5,4,0); a(5,5,0);                                           // L5: 2 → 144
    return p;
  }},
  dragon: { label:'🐉 Drache', build() {
    const p=[]; const a=(l,c,r)=>p.push({layer:l,col:c,row:r});
    for(let c=0;c<18;c++){a(0,c,2);a(0,c,3);}                   // spine: 36
    for(let c=6;c<12;c++){a(0,c,1);a(0,c,4);}                   // belly: 12
    for(let r=0;r<6;r++){a(0,18,r);a(0,-1,r);}                  // head+tail: 12 → L0=60
    for(let c=1;c<17;c++){a(1,c,2);a(1,c,3);}                   // L1: 32
    for(let c=3;c<15;c++){a(2,c,2);a(2,c,3);}                   // L2: 24
    for(let c=5;c<13;c++){a(3,c,2);a(3,c,3);}                   // L3: 16
    for(let c=7;c<11;c++){a(4,c,2);a(4,c,3);}                   // L4: 8
    for(let c=8;c<10;c++){a(5,c,2);a(5,c,3);}                   // L5: 4 → 144
    return p;
  }},
  pyramid: { label:'🔺 Pyramide', build() {
    const p=[]; const a=(l,c,r)=>p.push({layer:l,col:c,row:r});
    for(let r=0;r<6;r++) for(let c=0;c<12;c++) a(0,c,r);        // L0: 72
    for(let r=1;r<5;r++) for(let c=1;c<=9;c++)  a(1,c,r);       // L1: 36
    for(let r=1;r<4;r++) for(let c=2;c<=9;c++)  a(2,c,r);       // L2: 24
    for(let r=1;r<3;r++) for(let c=3;c<=8;c++)  a(3,c,r);       // L3: 12 → 144
    return p;
  }},
  cross: { label:'✚ Kreuz', build() {
    const p=[]; const a=(l,c,r)=>p.push({layer:l,col:c,row:r});
    for(let r=2;r<6;r++) for(let c=0;c<12;c++) a(0,c,r);        // horiz bar: 48
    for(let c=3;c<9;c++){a(0,c,0);a(0,c,1);a(0,c,6);a(0,c,7);} // vert ext: 24 → L0=72
    for(let r=2;r<6;r++) for(let c=1;c<=10;c++) a(1,c,r);       // L1: 40
    for(let r=2;r<6;r++) for(let c=3;c<=8;c++)  a(2,c,r);       // L2: 24
    for(let r=3;r<5;r++) for(let c=4;c<=7;c++)  a(3,c,r);       // L3: 8 → 144
    return p;
  }},
  castle: { label:'🏰 Festung', build() {
    const p=[]; const a=(l,c,r)=>p.push({layer:l,col:c,row:r});
    for(let r=0;r<8;r++) for(let c=0;c<9;c++) a(0,c,r);         // L0: 72
    for(let r=1;r<7;r++) for(let c=1;c<=7;c++) a(1,c,r);        // L1: 42
    for(let r=2;r<7;r++) for(let c=2;c<=5;c++) a(2,c,r);        // L2: 20
    for(let r=3;r<5;r++) for(let c=2;c<=6;c++) a(3,c,r);        // L3: 10 → 144
    return p;
  }},
};

// ─── THREE.JS SETUP ───────────────────────────────────────────────────────────
let scene, camera, renderer, raycaster;
const mouse      = new THREE.Vector2();
const meshToTile = new Map();

// Shared geometry (all tiles the same shape)
const TILE_W=1.0, TILE_H=1.3, TILE_D=0.28;
const tileGeo = new THREE.BoxGeometry(TILE_W, TILE_H, TILE_D);

// Board spacing
const STEP_X=1.08, STEP_Y=1.36, STEP_Z=TILE_D;
const LAY_X=0.05,  LAY_Y=0.04;  // XY shift per layer for stacking parallax

function tilePos(col, row, layer) {
  return new THREE.Vector3(
    col * STEP_X + layer * LAY_X,
    -row * STEP_Y + layer * LAY_Y,
    layer * STEP_Z
  );
}

// Base material colors
const C = {
  side: new THREE.Color(0xc0ad80),
  top:  new THREE.Color(0xddd0a0),
  bot:  new THREE.Color(0x9a8055),
  back: new THREE.Color(0xd0c494),
  face: new THREE.Color(1,1,1),    // white → texture shows through
};

// Tints for game states
const TINT = {
  normal:   new THREE.Color(1,1,1),
  blocked:  new THREE.Color(0.48,0.48,0.48),
  selected: new THREE.Color(1.0, 0.90, 0.25),
  hint:     new THREE.Color(0.30, 1.0, 0.80),
};

function applyState(tile, state) {
  if(!tile.mesh) return;
  const m   = tile.mesh.material;  // [+x, -x, +y, -y, +z(front), -z(back)]
  const tnt = TINT[state];
  const bases = [C.side, C.side, C.top, C.bot, C.face, C.back];

  // Reset z-pop
  const base = tilePos(tile.col, tile.row, tile.layer);
  tile.mesh.position.z = base.z + (state==='selected' ? 0.14 : 0);

  if(state==='blocked') {
    for(let i=0;i<6;i++) m[i].color.copy(bases[i]).multiply(tnt);
  } else if(state==='selected' || state==='hint') {
    // Only tint front face; sides stay normal
    for(let i=0;i<6;i++) m[i].color.copy(bases[i]);
    m[4].color.multiply(tnt);
  } else { // normal
    for(let i=0;i<6;i++) m[i].color.copy(bases[i]);
  }
}

// ─── CANVAS TEXTURES ──────────────────────────────────────────────────────────
const texCache = new Map();
const SUIT_COLOR = {
  man:'#c0392b', pin:'#1a4a8a', sou:'#1a7a3c',
  wind:'#2c3e50', dragon:'#8b0000', flower:'#7b2d8b', season:'#c05010',
};

function getFaceTex(tile) {
  const k = tile.suit + tile.idx;
  if(texCache.has(k)) return texCache.get(k);

  const W=128, H=168;
  const cv = document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');

  // Background gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fdf6e2'); g.addColorStop(1,'#ede4c4');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(0,0,W,H,10); ctx.fill();

  // Outer border
  ctx.strokeStyle = '#8a7a50'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.roundRect(1.75,1.75,W-3.5,H-3.5,8.5); ctx.stroke();

  // Inner gloss line
  ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(4,4,W-8,H-8,6); ctx.stroke();

  // Main symbol
  ctx.fillStyle = SUIT_COLOR[tile.suit] || '#333';
  ctx.font = `bold 58px "Noto Serif SC","Apple Color Emoji",serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(tile.glyph, W/2, H/2 + 6);

  // Corner rank for numbered suits
  if(['man','pin','sou'].includes(tile.suit)) {
    ctx.font = `bold 14px "Noto Serif SC",serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(tile.idx+1, 11, 13);
    ctx.save(); ctx.translate(W-11,H-13); ctx.rotate(Math.PI);
    ctx.fillText(tile.idx+1, 0, 0); ctx.restore();
  }

  const tex = new THREE.CanvasTexture(cv);
  texCache.set(k, tex);
  return tex;
}

function makeMaterials(tile) {
  const tex = getFaceTex(tile);
  return [
    new THREE.MeshLambertMaterial({color: C.side.clone()}),   // +x right
    new THREE.MeshLambertMaterial({color: C.side.clone()}),   // -x left
    new THREE.MeshLambertMaterial({color: C.top.clone()}),    // +y top
    new THREE.MeshLambertMaterial({color: C.bot.clone()}),    // -y bottom
    new THREE.MeshLambertMaterial({map: tex, color: C.face.clone(), transparent:true, opacity:1}), // +z front
    new THREE.MeshLambertMaterial({color: C.back.clone()}),   // -z back
  ];
}

function addTileMesh(tile) {
  const mesh = new THREE.Mesh(tileGeo, makeMaterials(tile));
  mesh.position.copy(tilePos(tile.col, tile.row, tile.layer));
  // renderOrder so higher-layer tiles appear on top in case of depth ties
  mesh.renderOrder = tile.layer * 200 + tile.row * 10 + tile.col;
  scene.add(mesh);
  meshToTile.set(mesh, tile);
  tile.mesh = mesh;
}

// ─── THREE.JS INIT ────────────────────────────────────────────────────────────
function initThree() {
  const area = document.getElementById('game-area');
  const W = area.clientWidth, H = area.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1a2e);

  camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 300);

  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.sortObjects = true;
  area.appendChild(renderer.domElement);

  // Lighting: warm key from upper-right, cool fill, soft ambient
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xfff5d0, 1.1);
  key.position.set(6, 10, 12); scene.add(key);
  const fill = new THREE.DirectionalLight(0x8aaaff, 0.25);
  fill.position.set(-5, 3, -4); scene.add(fill);

  raycaster = new THREE.Raycaster();
  renderer.domElement.addEventListener('click', onCanvasClick);

  ;(function loop() {
    requestAnimationFrame(loop);
    renderer.render(scene, camera);
  })();
}

function onCanvasClick(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects([...meshToTile.keys()]);
  if(!hits.length) return;
  const tile = meshToTile.get(hits[0].object);
  if(tile) clickTile(tile);
}

function fitCamera() {
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const t of tiles) {
    const p = tilePos(t.col, t.row, t.layer);
    minX=Math.min(minX,p.x-TILE_W/2); maxX=Math.max(maxX,p.x+TILE_W/2);
    minY=Math.min(minY,p.y-TILE_H/2); maxY=Math.max(maxY,p.y+TILE_H/2);
  }
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const bw=maxX-minX, bh=maxY-minY;
  const aspect = camera.aspect;
  const fovR   = camera.fov * Math.PI/180;
  const distH  = (bh/2 + 0.8) / Math.tan(fovR/2);
  const distW  = (bw/2 + 0.8) / (Math.tan(fovR/2)*aspect);
  const dist   = Math.max(distH, distW) * 1.12;

  // Slight downward tilt (~14°) to show tile depth / stacking
  const tilt = 0.24;
  camera.position.set(cx, cy + dist*Math.sin(tilt)*0.7, dist*Math.cos(tilt));
  camera.lookAt(cx, cy - 0.4, 0);
  camera.updateProjectionMatrix();
}

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let tiles = [], selected = null;
let score = 0, pairsRemoved = 0;
let timerStart, timerInterval;
let history  = [];
let hintTiles = [], hintTimeout = null;

// ─── NEW GAME ─────────────────────────────────────────────────────────────────
function newGame() {
  document.getElementById('overlay').classList.remove('show');
  clearInterval(timerInterval);
  selected = null; score = 0; pairsRemoved = 0; history = [];
  hintTiles.forEach(t=>t.hinting=false); hintTiles=[]; clearTimeout(hintTimeout);
  updateStats();

  const layoutKey = document.getElementById('layout-select').value;
  const layout = LAYOUTS[layoutKey].build();

  // Build tile pool (144)
  const types = buildTileTypes();
  const pool  = [];
  for(const t of types) {
    const n = t.matchGroup ? 1 : 4;
    for(let i=0;i<n;i++) pool.push({...t});
  }
  for(let i=pool.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }

  // Create tile objects
  tiles = layout.map((pos,i) => ({
    id: i, col:pos.col, row:pos.row, layer:pos.layer,
    suit:pool[i].suit, idx:pool[i].idx, glyph:pool[i].glyph,
    key:pool[i].key, matchGroup:pool[i].matchGroup||null,
    removed:false, hinting:false, mesh:null,
  }));

  renderBoard();
  timerStart = Date.now();
  timerInterval = setInterval(()=>{
    document.getElementById('timer-val').textContent = fmt(Math.floor((Date.now()-timerStart)/1000));
  }, 1000);
}

// ─── RENDER BOARD ─────────────────────────────────────────────────────────────
function renderBoard() {
  // Remove old meshes
  meshToTile.forEach((_t,mesh)=>scene.remove(mesh));
  meshToTile.clear();

  for(const t of tiles) {
    if(!t.removed) addTileMesh(t);
  }
  fitCamera();
  updateFreeStatus();
}

// ─── FREE-TILE LOGIC ──────────────────────────────────────────────────────────
function isFree(tile) {
  if(tile.removed) return false;
  // Blocked above: tile at same (col,row) on next layer
  if(tiles.some(o => !o.removed && o.layer===tile.layer+1 && o.col===tile.col && o.row===tile.row))
    return false;
  // Need at least one open side
  const hasL = tiles.some(o => !o.removed && o.layer===tile.layer && o.col===tile.col-1 && o.row===tile.row);
  const hasR = tiles.some(o => !o.removed && o.layer===tile.layer && o.col===tile.col+1 && o.row===tile.row);
  return !hasL || !hasR;
}

function updateFreeStatus() {
  for(const t of tiles) {
    if(t.removed || !t.mesh) continue;
    let state;
    if(t === selected)     state = 'selected';
    else if(t.hinting)     state = 'hint';
    else if(!isFree(t))    state = 'blocked';
    else                   state = 'normal';
    applyState(t, state);
  }
}

function tilesMatch(a,b) {
  if(a.id===b.id) return false;
  if(a.matchGroup && b.matchGroup) return a.matchGroup===b.matchGroup;
  return a.key===b.key;
}

// ─── CLICK ────────────────────────────────────────────────────────────────────
function clickTile(tile) {
  if(tile.removed || !isFree(tile)) return;

  if(selected===null) {
    selected = tile;
    applyState(tile, 'selected');
    return;
  }
  if(selected===tile) {
    selected = null;
    applyState(tile, 'normal');
    return;
  }

  if(tilesMatch(selected, tile)) {
    const a=selected, b=tile;
    history.push({a,b});
    selected = null;
    pairsRemoved++; score += 10;
    updateStats();
    animateRemove(a, b, ()=>{ updateFreeStatus(); checkEnd(); });
  } else {
    // Change selection
    applyState(selected, isFree(selected) ? 'normal' : 'blocked');
    selected = tile;
    applyState(tile, 'selected');
  }
}

// ─── REMOVE ANIMATION ─────────────────────────────────────────────────────────
function animateRemove(a, b, onDone) {
  // Make front face material transparent-capable (already set at creation)
  [a,b].forEach(t=>{
    if(t.mesh) t.mesh.material.forEach(m=>{m.transparent=true;m.opacity=1;});
  });
  const start=Date.now(), DUR=260;
  function tick() {
    const p = Math.min((Date.now()-start)/DUR, 1);
    [a,b].forEach(t=>{
      if(!t.mesh) return;
      const s=1-p;
      t.mesh.scale.setScalar(Math.max(s,0.001));
      t.mesh.material.forEach(m=>m.opacity=1-p);
    });
    if(p<1) { requestAnimationFrame(tick); return; }
    [a,b].forEach(t=>{
      t.removed=true;
      scene.remove(t.mesh);
      meshToTile.delete(t.mesh);
      t.mesh=null;
    });
    onDone();
  }
  requestAnimationFrame(tick);
}

// ─── UNDO ─────────────────────────────────────────────────────────────────────
function undoMove() {
  if(!history.length) return;
  const {a,b} = history.pop();
  if(selected){ applyState(selected,'normal'); selected=null; }
  [a,b].forEach(id=>{
    const t=tiles[id.id];
    t.removed=false;
    addTileMesh(t);
  });
  pairsRemoved--; score=Math.max(0,score-10);
  updateFreeStatus(); updateStats();
}

// ─── HINT ─────────────────────────────────────────────────────────────────────
function showHint() {
  // Clear previous hint
  if(hintTimeout){ clearTimeout(hintTimeout); hintTimeout=null; }
  hintTiles.forEach(t=>{ t.hinting=false; });
  hintTiles=[];

  const free = tiles.filter(t=>!t.removed && isFree(t));
  for(let i=0;i<free.length;i++) {
    for(let j=i+1;j<free.length;j++) {
      if(tilesMatch(free[i],free[j])) {
        hintTiles=[free[i],free[j]];
        hintTiles.forEach(t=>{t.hinting=true;});
        updateFreeStatus();
        hintTimeout=setTimeout(()=>{
          hintTiles.forEach(t=>{t.hinting=false;});
          hintTiles=[]; hintTimeout=null;
          updateFreeStatus();
        },1700);
        return;
      }
    }
  }
  const el=document.getElementById('no-moves');
  el.style.display='block';
  clearTimeout(showHint._t);
  showHint._t=setTimeout(()=>el.style.display='none',2800);
}

// ─── WIN / LOSE ───────────────────────────────────────────────────────────────
function checkEnd() {
  const left = tiles.filter(t=>!t.removed);
  if(!left.length) {
    clearInterval(timerInterval);
    const s=Math.floor((Date.now()-timerStart)/1000);
    showOverlay('勝利!',`Alle 72 Paare entfernt! Zeit: ${fmt(s)} · Punkte: ${score}`);
    return;
  }
  const free=left.filter(t=>isFree(t));
  let ok=false;
  outer: for(let i=0;i<free.length;i++)
    for(let j=i+1;j<free.length;j++)
      if(tilesMatch(free[i],free[j])){ok=true;break outer;}
  if(!ok){
    clearInterval(timerInterval);
    showOverlay('Keine Züge',`Keine weiteren Züge möglich. Noch ${left.length} Steine übrig.`);
  }
}

function showOverlay(title,msg) {
  document.getElementById('overlay-title').textContent=title;
  document.getElementById('overlay-msg').textContent=msg;
  document.getElementById('overlay').classList.add('show');
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('score-val').textContent=score;
  document.getElementById('pairs-val').textContent=pairsRemoved;
  document.getElementById('left-val').textContent=tiles.filter(t=>!t.removed).length;
}
function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

// ─── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  const area=document.getElementById('game-area');
  const W=area.clientWidth, H=area.clientHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
  if(tiles.length) fitCamera();
});

// ─── START ────────────────────────────────────────────────────────────────────
initThree();
document.fonts.ready.then(()=>newGame());
</script>
